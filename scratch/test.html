<!DOCTYPE html><html><head><style>body { margin: 0; overflow: hidden; background: black; color: white; } .display-scaler { --zoom: 1.25; width: calc(100vw / var(--zoom)); height: calc(100vh / var(--zoom)); transform: scale(var(--zoom)); transform-origin: top left; border: 2px solid red; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; } .text { font-size: 5vh; border: 1px solid blue; }</style></head><body><div class=display-scaler><div class=text>Top 5vh text</div><div class=text>Bottom 5vh text</div></div></body></html>
