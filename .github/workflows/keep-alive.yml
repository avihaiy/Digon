name: Keep Appwrite Alive

on:
  schedule:
    # Runs every day at 12:00 UTC (noon)
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-appwrite:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Appwrite Database
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "X-Appwrite-Project: 6a6748ef003255232493" \
            https://fra.cloud.appwrite.io/v1/databases/6a674a380025507f9db2/collections/locations/documents
          echo "Pinged Appwrite to prevent project pause due to inactivity."
